[package]
name = "index-translate"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "OpenAI-compatible local bridge that exposes the free Index-Translate API to Immersive Translate"

[[bin]]
name = "index-translate"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
nix = { version = "0.29", features = ["process", "signal", "fs", "user"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2", "system-proxy"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
